<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>API 测试工具 - 403 错误排查</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 12px;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
            font-size: 13px;
            max-height: 600px;
            overflow-y: auto;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }
        .success {
            color: #388e3c;
            background: #e8f5e9;
        }
        .warning {
            color: #f57c00;
            background: #fff3e0;
        }
        .info-box {
            background: #e3f2fd;
            color: #1976d2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex;
            margin-bottom: 16px;
            border-bottom: 2px solid #ddd;
        }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            background: white;
            border: none;
            font-size: 14px;
        }
        .tab.active {
            border-bottom: 2px solid #667eea;
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 API 测试工具 - 403 错误排查</h1>

        <div class="info-box">
            <strong>常见 403 错误原因：</strong><br>
            1. API Key 格式错误（检查前缀 sk-）<br>
            2. API Endpoint 路径错误（应该是域名，不带 /v1）<br>
            3. 认证头格式错误（Bearer token）<br>
            4. 模型名称不正确<br>
            5. API Key 过期或无效<br>
            6. IP 被限制或需要白名单
        </div>

        <!-- Tab 切换 -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('basic')">基本测试</button>
            <button class="tab" onclick="showTab('advanced')">高级调试</button>
            <button class="tab" onclick="showTab('models')">模型列表</button>
        </div>

        <!-- 基本测试 -->
        <div id="tab-basic" style="display:block;">
            <div class="form-group">
                <label>API Endpoint (域名)</label>
                <input type="text" id="endpoint" placeholder="https://zhisuanyun.net" value="https://zhisuanyun.net">
                <small style="color:#999;font-size:12px;">不要带 /v1/chat/completions 路径</small>
            </div>

            <div class="form-group">
                <label>API Key</label>
                <input type="text" id="apiKey" placeholder="sk-xxxx">
            </div>

            <div class="form-group">
                <label>模型</label>
                <select id="model">
                    <option value="claude-3-5-sonnet-20241022">claude-3-5-sonnet</option>
                    <option value="claude-3-opus-20240229">claude-3-opus</option>
                    <option value="claude-3-haiku-20240307">claude-3-haiku</option>
                    <option value="gpt-4">gpt-4</option>
                    <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                </select>
            </div>

            <div class="form-group">
                <label>测试消息</label>
                <textarea id="message" rows="3" placeholder="你好">你好，请介绍一下你自己</textarea>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="testAPI()">🧪 测试 API</button>
                <button class="btn btn-secondary" onclick="testConnection()">🔗 测试连接</button>
            </div>
        </div>

        <!-- 高级调试 -->
        <div id="tab-advanced" style="display:none;">
            <div class="form-group">
                <label>自定义 Headers (JSON 格式)</label>
                <textarea id="customHeaders" rows="5">{
  "Content-Type": "application/json",
  "Authorization": "Bearer YOUR_API_KEY"
}</textarea>
            </div>

            <div class="form-group">
                <label>自定义 Body (JSON 格式)</label>
                <textarea id="customBody" rows="8">{
  "model": "claude-3-5-sonnet-20241022",
  "max_tokens": 1024,
  "messages": [
    {"role": "user", "content": "你好"}
  ]
}</textarea>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="testCustomRequest()">🚀 发送自定义请求</button>
                <button class="btn btn-secondary" onclick="showRequestPreview()">📝 查看请求预览</button>
            </div>
        </div>

        <!-- 模型列表 -->
        <div id="tab-models" style="display:none;">
            <div class="btn-group">
                <button class="btn" onclick="getModels()">📋 获取可用模型列表</button>
            </div>
            <div class="info-box" style="margin-top:16px;">
                点击按钮后，将尝试访问 /v1/models 接口获取支持的模型列表
            </div>
        </div>

        <!-- 结果显示 -->
        <div class="result-box" id="result">
等待测试...
        </div>
    </div>

    <script>
        let logMessages = [];

        function showTab(tabName) {
            // 切换 tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // 切换内容
            document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
            document.getElementById('tab-' + tabName).style.display = 'block';
        }

        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logMessages.push(`${prefix} [${timestamp}] ${msg}`);
            updateResult();
        }

        function updateResult() {
            const result = document.getElementById('result');
            result.innerHTML = logMessages.join('\n');
        }

        async function testConnection() {
            logMessages = [];
            log('开始测试连接...');

            const endpoint = document.getElementById('endpoint').value.trim();

            try {
                log(`测试 Endpoint: ${endpoint}`);

                // 测试基础连接
                const response = await fetch(endpoint, {
                    method: 'GET'
                });

                log(`响应状态: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'warning');
                log(`响应 Headers: ${JSON.stringify(response.headers).substring(0, 200)}`);

                const text = await response.text();
                log(`响应内容（前200字符）: ${text.substring(0, 200)}`);

            } catch (error) {
                log(`连接失败: ${error.message}`, 'error');
                log(`错误详情: ${error.stack || '无详细信息'}`, 'error');
            }
        }

        async function testAPI() {
            logMessages = [];
            log('开始测试 API...');

            const endpoint = document.getElementById('endpoint').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('model').value;
            const message = document.getElementById('message').value.trim();

            if (!endpoint || !apiKey) {
                log('请填写 Endpoint 和 API Key!', 'error');
                return;
            }

            const url = `${endpoint}/v1/chat/completions`;
            log(`请求 URL: ${url}`);
            log(`模型: ${model}`);
            log(`消息: ${message}`);

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            };

            log(`请求 Headers:\n${JSON.stringify(headers, null, 2)}`);

            const body = {
                model: model,
                max_tokens: 1024,
                messages: [
                    { role: 'user', content: message }
                ]
            };

            log(`请求 Body:\n${JSON.stringify(body, null, 2)}`);

            try {
                log('发送请求...');
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                log(`响应状态: ${response.status} ${response.statusText}`,
                    response.ok ? 'success' : response.status === 403 ? 'error' : 'warning');

                // 获取所有响应头
                log('响应 Headers:');
                for (let [key, value] of response.headers.entries()) {
                    log(`  ${key}: ${value}`);
                }

                const responseText = await response.text();
                log(`响应内容:\n${responseText.substring(0, 1000)}`);

                if (response.status === 403) {
                    log('\n=== 403 错误分析 ===', 'warning');
                    log('可能原因:', 'warning');
                    log('1. API Key 无效或过期');
                    log('2. 认证头格式错误（检查 Authorization: Bearer xxx）');
                    log('3. API 不支持当前模型');
                    log('4. IP 被限制');
                    log('5. 需要 API Key 前缀（如 sk-）');
                    log('建议: 检查 API Key 是否正确，联系 API 提供商确认格式', 'warning');
                }

                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        log('\n=== 请求成功 ===', 'success');
                        log(`回复内容: ${data.choices?.[0]?.message?.content || '无内容'}`, 'success');
                    } catch (e) {
                        log('响应解析失败，可能是非 JSON 格式', 'warning');
                    }
                }

            } catch (error) {
                log(`请求失败: ${error.message}`, 'error');
                if (error.message.includes('Failed to fetch')) {
                    log('可能是 CORS 问题或网络无法访问', 'error');
                    log('尝试解决方案:', 'warning');
                    log('1. 在服务器端发起请求（避免 CORS）');
                    log('2. 使用代理服务器');
                    log('3. 检查 Endpoint 是否正确');
                }
            }
        }

        async function testCustomRequest() {
            logMessages = [];
            log('发送自定义请求...');

            const endpoint = document.getElementById('endpoint').value.trim();
            const headersText = document.getElementById('customHeaders').value;
            const bodyText = document.getElementById('customBody').value;

            try {
                const headers = JSON.parse(headersText);
                const body = JSON.parse(bodyText);

                // 替换 API Key
                const apiKey = document.getElementById('apiKey').value.trim();
                if (headers.Authorization && headers.Authorization.includes('YOUR_API_KEY')) {
                    headers.Authorization = `Bearer ${apiKey}`;
                }

                log(`请求 URL: ${endpoint}/v1/chat/completions`);
                log(`Headers:\n${JSON.stringify(headers, null, 2)}`);
                log(`Body:\n${JSON.stringify(body, null, 2)}`);

                const response = await fetch(`${endpoint}/v1/chat/completions`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                log(`响应状态: ${response.status}`, response.ok ? 'success' : 'error');

                const text = await response.text();
                log(`响应内容:\n${text}`);

            } catch (error) {
                log(`错误: ${error.message}`, 'error');
            }
        }

        function showRequestPreview() {
            logMessages = [];
            const endpoint = document.getElementById('endpoint').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const headersText = document.getElementById('customHeaders').value;
            const bodyText = document.getElementById('customBody').value;

            try {
                const headers = JSON.parse(headersText);
                const body = JSON.parse(bodyText);

                if (headers.Authorization && headers.Authorization.includes('YOUR_API_KEY')) {
                    headers.Authorization = `Bearer ${apiKey}`;
                }

                log('=== 请求预览 ===');
                log(`URL: ${endpoint}/v1/chat/completions`);
                log(`Method: POST`);
                log(`Headers:\n${JSON.stringify(headers, null, 2)}`);
                log(`Body:\n${JSON.stringify(body, null, 2)}`);
            } catch (error) {
                log(`JSON 解析错误: ${error.message}`, 'error');
            }
        }

        async function getModels() {
            logMessages = [];
            log('获取模型列表...');

            const endpoint = document.getElementById('endpoint').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();

            if (!endpoint || !apiKey) {
                log('请填写 Endpoint 和 API Key!', 'error');
                return;
            }

            try {
                const response = await fetch(`${endpoint}/v1/models`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    }
                });

                log(`响应状态: ${response.status}`, response.ok ? 'success' : 'error');

                const text = await response.text();
                log(`响应内容:\n${text}`);

                if (response.ok) {
                    try {
                        const data = JSON.parse(text);
                        if (data.data && Array.isArray(data.data)) {
                            log('\n=== 可用模型 ===', 'success');
                            data.data.forEach(model => {
                                log(`- ${model.id}`, 'success');
                            });
                        }
                    } catch (e) {
                        log('解析失败', 'warning');
                    }
                }

            } catch (error) {
                log(`错误: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
